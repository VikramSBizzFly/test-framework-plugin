# Opt-in CI for Tier 1/2 JS projects. Copied in, never auto-enabled — commit
# it yourself once you're ready for the native suite to run in CI.
name: test-framework (native)

on:
  workflow_dispatch:
  pull_request:

jobs:
  native-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      # Credentials come from repo/environment secrets, never from a
      # committed tests/credentials.json.
      - run: npx playwright test
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL }}

      - if: always()
        run: node tests/junit-to-csv.mjs tests/results/junit.xml tests/results/run-${{ github.run_id }}.csv

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/results/*.csv
            test-results/**
